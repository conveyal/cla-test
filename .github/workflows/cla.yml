name: Test signature validation

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  signature:
    name: Validate test signature
    # Keep the reusable workflow and implementation on the same immutable release.
    uses: conveyal/CLA-Ledger/.github/workflows/validate-signature.yml@v0.0.1
    with:
      cla_root: .
      implementation_repository: conveyal/CLA-Ledger
      implementation_ref: v0.0.1
    permissions:
      contents: read
      pull-requests: write
